<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Event - Campus Events</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="nav"></div>

    <main>

        <h1>Book Your Ticket</h1>

        <p class="sub">
            Complete the form below to reserve your ticket.
        </p>

        <div id="eventDetails" class="card"></div>

        <div id="msg" class="msg"></div>

        <form id="bookingForm" class="card">

            <label for="quantity">
                Number of tickets
            </label>

            <input
                type="number"
                id="quantity"
                min="1"
                value="1"
                required
            >

            <p id="total"></p>

            <button type="submit" class="btn">
                Confirm Booking
            </button>

        </form>

    </main>

    <script src="js/api.js"></script>
    <script src="js/booking.js"></script>

</body>
</html>
