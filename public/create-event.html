<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create event - Campus Events</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div id="nav"></div>
<main>
  <div class="card" style="max-width:620px">
    <h1>Create an event</h1>
    <p class="sub">New events start as drafts. Publish one to open booking.</p>
    <form id="form">
      <label for="title">Title</label><input id="title" required>
      <label for="description">Description</label><textarea id="description" rows="3"></textarea>
      <label for="category">Category</label><input id="category" placeholder="e.g. Music, Sports, Career">
      <label for="venue">Venue</label><input id="venue">
      <label for="event_date">Date and time</label><input id="event_date" type="datetime-local" required>
      <label for="capacity">Capacity</label><input id="capacity" type="number" min="1" required>
      <label for="ticket_price">Ticket price (KES)</label><input id="ticket_price" type="number" min="0" step="0.01" value="0" required>
      <div id="msg" class="msg"></div>
      <button class="btn" type="submit">Create event</button>
    </form>
  </div>
  <h2 style="margin-top:32px">My events</h2>
  <div id="mine"></div>
</main>
<script src="js/api.js"></script><script src="js/create-event.js"></script>
</body></html>
